services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rekol
      POSTGRES_USER: rekol
      POSTGRES_PASSWORD: rekol
    ports: ["5432:5432"]
    volumes: ["rekol-postgres:/var/lib/postgresql/data"]
  auth-service:
    build: .
    depends_on: [postgres]
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/rekol
      DATABASE_USER: rekol
      DATABASE_PASSWORD: rekol
      DEV_OTP_BYPASS: "true"
    ports: ["8000:8000"]
volumes:
  rekol-postgres:
