services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    volumes: ["./backend/app:/app/app"]
    depends_on: [postgres, redis, minio]
    environment:
      DATABASE_URL: postgresql+psycopg://rekol:rekol@postgres:5432/rekol
      REDIS_URL: redis://redis:6379/0
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rekol
      POSTGRES_USER: rekol
      POSTGRES_PASSWORD: rekol
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rekol
      MINIO_ROOT_PASSWORD: rekol-development
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
volumes:
  postgres_data:
  minio_data:
